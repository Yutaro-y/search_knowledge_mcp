[project]
name = "search-knowledge-mcp"
version = "0.1.0"
description = "MCP server for collecting up-to-date network, OS, CVE, release-note, and technical reference information via OpenAI web search."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Your Name" }
]
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "openai", "search", "network", "cve"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]
dependencies = [
  "mcp[cli]>=1.9.0",
  "openai>=1.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/yourname/search-knowledge-mcp"
Repository = "https://github.com/yourname/search-knowledge-mcp"
Issues = "https://github.com/yourname/search-knowledge-mcp/issues"
Changelog = "https://github.com/yourname/search-knowledge-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.4.0",
]

[project.scripts]
search-knowledge-mcp = "search_knowledge_mcp.server:main"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/search_knowledge_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
